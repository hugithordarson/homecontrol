<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title><wo:str value="$title" /></title>
		<style>
			body { margin: 0; font-family: system-ui, sans-serif; background: #16181d; color: #e6e6e6; }
			nav { background: #0e1013; padding: 12px 16px; display: flex; gap: 20px; align-items: baseline; }
			nav a { color: #9fb3c8; text-decoration: none; }
			nav a:hover { color: #fff; }
			nav .brand { font-weight: bold; }
			nav .brand a { color: #ffc66d; }
			h1 { margin-bottom: 0; }
			a { color: #7cb8e8; }

			button { font: inherit; border: none; border-radius: 8px; padding: 8px 14px; cursor: pointer; background: #2b313b; color: #e6e6e6; }
			button:hover { background: #39414e; }
			button.big { font-weight: bold; background: #ffc66d; color: #1c1c1c; }
			button.big:hover { background: #ffd68f; }
			button.big.off { background: #2b313b; color: #e6e6e6; }
			button.big.off:hover { background: #39414e; }
			button.bolt { background: #3a3254; font-size: 1.1em; padding: 8px 12px; }
			button.bolt:hover { background: #4c4270; }
			button.scene { background: #23405c; }
			button.scene:hover { background: #2d537a; }

			.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 20px 0; }
			.toolbar .scenes { display: flex; flex-wrap: wrap; gap: 8px; margin-left: 12px; }

			.rooms { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
			@media (max-width: 700px) { .rooms { grid-template-columns: 1fr; } }
			.room { background: #20242c; border-radius: 12px; padding: 6px 16px 14px; }
			.room header { display: flex; justify-content: space-between; align-items: center; }
			.room h2 { font-size: 1.05em; margin: 10px 0; }
			.room .roombuttons { display: flex; gap: 6px; }
			.room .hubtag { color: #8a93a1; font-size: 0.7em; font-weight: normal; margin-left: 8px; background: #2b313b; border-radius: 5px; padding: 2px 7px; vertical-align: middle; }
			.room .rename { background: none; color: #4a5260; padding: 0 6px; font-size: 0.85em; }
			.room .rename:hover { color: #e6e6e6; background: none; }
			.room .roombuttons button { padding: 4px 10px; font-size: 0.85em; }
			.room .roombolt { background: #3a3254; }
			.room .roombolt:hover { background: #4c4270; }
			.room .roomcycle { background: #2b313b; }
			.room .roomcycle.active { background: #245c38; color: #a5edc3; }

			.light { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
			.light .bulb { background: none; font-size: 1.2em; color: #4a5260; padding: 2px 6px; }
			.light.on .bulb { color: #ffc66d; text-shadow: 0 0 10px rgba(255, 198, 109, 0.7); }
			.light.unreachable { opacity: 0.4; }
			.light .lightname { flex: 1; min-width: 0; overflow-wrap: break-word; }
			.light input[type=range] { width: 120px; accent-color: #ffc66d; }
			.light input[type=range].temp { width: 90px; accent-color: #9ec9ec; background: linear-gradient(to right, #ffb46b, #cfe4f5); border-radius: 4px; height: 6px; align-self: center; }
			.light input[type=color] { width: 28px; height: 28px; padding: 0; border: none; border-radius: 6px; background: none; cursor: pointer; }
			.light .lightbolt { background: none; color: #4a5260; padding: 2px 6px; }
			.light .lightbolt:hover { color: #ffc66d; background: none; }

			.error { background: #4a2028; border-radius: 8px; padding: 10px 14px; }
			.hubnote { color: #8a93a1; font-size: 0.85em; margin: 8px 0 0; }
			.toolbar .scene.away { opacity: 0.4; }
			.hint, .dim { color: #8a93a1; }
			input[type=text] { font: inherit; background: #12151a; color: #e6e6e6; border: 1px solid #39414e; border-radius: 8px; padding: 8px 12px; }
			table.scenetable { border-collapse: collapse; }
			table.scenetable td { padding: 8px 16px 8px 0; }
			a.danger { color: #e88; }
		</style>
		<script>
			const hc = {
				_levelTimers: {},
				post: function( path ) { return fetch( path, { method: 'POST' } ); },
				reloadSoon: function() { setTimeout( function() { location.reload(); }, 500 ); },
				all: function( state ) { hc.post( '/api/all/' + state ).then( hc.reloadSoon ); },
				room: function( id, state ) { hc.post( '/api/room/' + id + '/' + state ).then( hc.reloadSoon ); },
				toggle: function( id ) { hc.post( '/api/toggle/' + id ).then( hc.reloadSoon ); },
				scene: function( slug ) { hc.post( '/api/scene/' + slug ).then( hc.reloadSoon ); },
				level: function( id, value ) {
					clearTimeout( hc._levelTimers[id] );
					hc._levelTimers[id] = setTimeout( function() { hc.post( '/api/level/' + id + '/' + value ); }, 150 );
				},
				_tempTimers: {},
				temp: function( id, kelvin ) {
					clearTimeout( hc._tempTimers[id] );
					hc._tempTimers[id] = setTimeout( function() { hc.post( '/api/temperature/' + id + '/' + kelvin ); }, 150 );
				},
				_audioCtx: null,
				audioCtx: function() {
					if( !hc._audioCtx ) { hc._audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
					if( hc._audioCtx.state === 'suspended' ) { hc._audioCtx.resume(); }
					return hc._audioCtx;
				},
				thunderOn: function() { return localStorage.getItem( 'hc.thunder' ) === 'on'; },
				toggleThunder: function() {
					localStorage.setItem( 'hc.thunder', hc.thunderOn() ? 'off' : 'on' );
					hc.updateThunderButton();
					if( hc.thunderOn() ) { hc.thunderclap(); }
				},
				updateThunderButton: function() {
					var b = document.getElementById( 'thunderToggle' );
					if( b ) { b.textContent = hc.thunderOn() ? '🔊 Thunder on' : '🔇 Thunder off'; }
				},
				strike: function( url ) {
					hc.post( url );
					if( hc.thunderOn() ) { setTimeout( hc.thunderclap, 150 + Math.random() * 500 ); }
				},
				thunderclap: function() {
					var ctx = hc.audioCtx();
					var now = ctx.currentTime;
					for( var i = 0; i < 3; i++ ) {
						var dur = 1.5 + Math.random() * 1.5;
						var start = now + ( i === 0 ? 0 : Math.random() * 0.5 );
						var buf = ctx.createBuffer( 1, ctx.sampleRate * dur, ctx.sampleRate );
						var data = buf.getChannelData( 0 );
						var last = 0;
						for( var j = 0; j < data.length; j++ ) {
							last = ( last + 0.02 * ( Math.random() * 2 - 1 ) ) / 1.02;
							data[j] = last * 3.5;
						}
						var src = ctx.createBufferSource();
						src.buffer = buf;
						var filter = ctx.createBiquadFilter();
						filter.type = 'lowpass';
						filter.frequency.setValueAtTime( i === 0 ? 900 : 400, start );
						filter.frequency.exponentialRampToValueAtTime( 60, start + dur );
						var gain = ctx.createGain();
						gain.gain.setValueAtTime( 0, start );
						gain.gain.linearRampToValueAtTime( i === 0 ? 0.9 : 0.5, start + 0.02 + Math.random() * 0.05 );
						gain.gain.exponentialRampToValueAtTime( 0.001, start + dur );
						src.connect( filter );
						filter.connect( gain );
						gain.connect( ctx.destination );
						src.start( start );
						src.stop( start + dur );
					}
				},
				floorSel: null,
				_roomLevelTimers: {},
				roomLevel: function( id, value ) {
					clearTimeout( hc._roomLevelTimers[id] );
					hc._roomLevelTimers[id] = setTimeout( function() { hc.post( '/api/room-level/' + id + '/' + value ); }, 200 );
				},
				_roomColorTimers: {},
				roomColor: function( id, hex ) {
					clearTimeout( hc._roomColorTimers[id] );
					hc._roomColorTimers[id] = setTimeout( function() {
						var hs = hc.hexToHueSat( hex );
						hc.post( '/api/room-color/' + id + '/' + hs.hue + '/' + hs.sat );
					}, 200 );
				},
				cycle: function( id ) {
					hc.post( '/api/cycle/' + id ).then( hc.reloadSoon );
				},
				renameRoom: function( id, currentName ) {
					var name = prompt( 'New room name:', currentName );
					if( name && name.trim() && name.trim() !== currentName ) {
						hc.post( '/api/rename-room/' + id + '?name=' + encodeURIComponent( name.trim() ) ).then( hc.reloadSoon );
					}
				},
				color: function( id, hex ) {
					clearTimeout( hc._colorTimers[id] );
					hc._colorTimers[id] = setTimeout( function() {
						var hs = hc.hexToHueSat( hex );
						hc.post( '/api/color/' + id + '/' + hs.hue + '/' + hs.sat );
					}, 150 );
				},
				_colorTimers: {},
				hexToHueSat: function( hex ) {
					var r = parseInt( hex.substring( 1, 3 ), 16 ) / 255;
					var g = parseInt( hex.substring( 3, 5 ), 16 ) / 255;
					var b = parseInt( hex.substring( 5, 7 ), 16 ) / 255;
					var max = Math.max( r, g, b ), min = Math.min( r, g, b ), d = max - min;
					var h = 0;

					if( d > 0 ) {
						if( max === r ) { h = ( ( g - b ) / d ) % 6; }
						else if( max === g ) { h = ( b - r ) / d + 2; }
						else { h = ( r - g ) / d + 4; }
						h = h * 60;
						if( h < 0 ) { h = h + 360; }
					}

					return { hue: Math.round( h ), sat: max === 0 ? 0 : ( d / max ).toFixed( 2 ) };
				}
			};
		</script>
	</head>
	<body>
		<nav>
			<span class="brand"><a href="/">HomeControl</a></span>
			<a href="/">Lights</a>
			<a href="/floor">Floor plan</a>
			<a href="/scenes">Scenes</a>
			<a href="/setup">Setup</a>
		</nav>
		<wo:container elementName="main" style="$mainStyle">
			<wo:content />
		</wo:container>
		<script>hc.updateThunderButton();</script>
	</body>
</html>
