<wo:PageWrapper title="Floor plan" width="1240px">
	<style>
		.floorwrap svg { width: 100%; max-width: 980px; display: block; margin: 0 auto; background: #0e1013; border-radius: 12px; }
		.region { stroke: #454d59; stroke-width: 60; cursor: default; }
		.region.mapped { cursor: pointer; }
		.region.mapped:hover { stroke: #9fb3c8; }
		.region.selected { stroke: #ffc66d; stroke-width: 110; }
		.region.droptarget { stroke: #ffc66d; stroke-width: 140; }
		.roomlabel { fill: #8a93a1; font-size: 380px; font-family: system-ui, sans-serif; pointer-events: none; }
		.region.on + .roomlabel { fill: #e6e6e6; }
		.floorrooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-top: 16px; }
		.floorrooms .room[hidden] { display: none; }
	</style>

	<div class="floorwrap">
		<svg viewBox="0 0 15200 12600" xmlns="http://www.w3.org/2000/svg">
			<rect x="300" y="300" width="12800" height="10450" fill="none" stroke="#5a6472" stroke-width="200" />
			<wo:repetition list="$regions" item="$currentRegion">
				<wo:container elementName="polygon" points="$currentPoints" class="$currentCss" fill="$currentFill" data-room="$currentRoomId" data-name="$currentRegion.name" onclick="hc.selectRoom(this)" ondragover="hc.dragOver(event)" ondrop="hc.dropOnRoom(event, this)" />
				<wo:container elementName="text" x="$currentLabelX" y="$currentLabelY" class="roomlabel" style="$currentLabelStyle" text-anchor="middle"><wo:str value="$currentRegion.name" /></wo:container>
			</wo:repetition>
		</svg>
	</div>

	<p class="hint">Regions show live light state. Tap a room to select its lights (tap again to deselect); the panel controls the selection. Drag a palette chip onto any room. Selected rooms list their lights below — tap a light to drop it from the selection.</p>

	<div class="floorrooms">
		<wo:repetition list="$regions" item="$currentRegion">
			<wo:container elementName="section" class="room fplights" data-room="$currentRoomId" data-name="$currentRegion.name" data-cyclable="$currentRoomCyclable" data-renamable="$currentRoomRenamable" hidden="hidden" ondragover="hc.dragOver(event)" ondrop="hc.dropOnRoom(event, this)">
				<header><h2 class="roomname" onclick="hc.selectRoom(this.closest('.room'))"><wo:str value="$currentRegion.name" /></h2></header>
				<wo:repetition list="$currentRegionLights" item="$currentLight">
					<wo:container elementName="div" class="$currentLightRowClass" data-id="$currentLight.id" data-dimmable="$currentLight.dimmable" data-color="$currentLight.supportsColor" data-temp="$currentLight.supportsColorTemperature" data-warm="$currentLightWarmest" data-cold="$currentLightColdest" data-level="$currentLightLevel" data-kelvin="$currentLightTemperature" data-hex="$currentLightColorHex" onclick="hc.toggleSelect(this)" ondragover="hc.dragOver(event)" ondrop="hc.dropOnLight(event, this)">
						<wo:container elementName="button" class="bulb" style="$currentLightBulbStyle" onclick="$currentLightToggleJS" title="Toggle">&#9679;</wo:container>
						<span class="lightname"><wo:str value="$currentLight.name" /></span>
						<span class="lightmeta"><wo:str value="$currentLightMeta" /></span>
					</wo:container>
				</wo:repetition>
			</wo:container>
		</wo:repetition>
	</div>

	<wo:SelectionPanel />

	<script>
		// Keep the state display fresh-ish until we grow a live feed (the selection survives the reload)
		setTimeout( function() { if( !document.hidden ) { location.reload(); } }, 15000 );
	</script>
</wo:PageWrapper>
