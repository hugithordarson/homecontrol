<wo:PageWrapper title="Setup" width="600px">
	<h1>Hub setup</h1>

	<wo:if condition="$hasError">
		<p class="error"><wo:str value="$error" /></p>
	</wo:if>

	<wo:if condition="$hasHubs">
		<h2>Paired hubs</h2>
		<table class="scenetable">
			<wo:repetition list="$hubs" item="$currentHub">
				<tr>
					<td><strong><wo:str value="$currentHub.name" /></strong></td>
					<td class="dim"><wo:str value="$currentHub.address" /></td>
					<td><wo:link action="$removeCurrentHub" class="danger">Remove</wo:link></td>
				</tr>
			</wo:repetition>
		</table>
	</wo:if>

	<wo:if condition="$pairingNotStarted">
		<h2>Pair a hub</h2>
		<p>Enter the IP address of the DIRIGERA hub. You can find it in your router's device list, or in the IKEA Home smart app under hub settings.</p>
		<wo:form>
			<wo:textfield value="$hubName" placeholder="Name, e.g. Office" />
			<wo:textfield value="$hubAddress" placeholder="e.g. 192.168.1.100" />
			<wo:submit action="$startPairing" value="Start pairing" />
		</wo:form>
	</wo:if>

	<wo:if condition="$pairingStarted">
		<p><strong>Now press the action button</strong> on the bottom of the hub. You have about 90 seconds. Then:</p>
		<wo:form>
			<wo:submit action="$completePairing" value="I pressed the button" />
			<wo:submit action="$cancelPairing" value="Start over" />
		</wo:form>
	</wo:if>
</wo:PageWrapper>
